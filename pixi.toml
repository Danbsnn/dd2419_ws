[activation.env]
# Works with Linux and macOS
RMW_IMPLEMENTATION = "rmw_cyclonedds_cpp"
ROS_AUTOMATIC_DISCOVERY_RANGE = "SUBNET"  # LOCALHOST, SUBNET
ROS_DOMAIN_ID = "7"                       # Change to group number
NO_AT_BRIDGE= "1"
QT_QPA_PLATFORM = "xcb"

[pypi-dependencies]
hsv-calibration = ">=0.7, <0.8"
ikpy = ">=3.4.2, <4"
