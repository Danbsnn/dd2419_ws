[workspace]
authors = ["Daniel Duberg <danielduberg@gmail.com>"]
name = "dd2419_ws"
channels = [
  "https://prefix.dev/conda-forge",
  "https://prefix.dev/robostack-jazzy",
]
platforms = [
  "osx-arm64",
  "linux-64",
]
version = "1.0.0"
preview = ["pixi-build"]

[tasks]
flash_arm = { cmd = "platformio run --target upload", cwd = "PlatformIO/Projects/dd2419" }

foxglove_server = { cmd = "ros2 launch foxglove_bridge foxglove_bridge_launch.xml port:=8765" }

arm = { cmd = "ros2 launch robp_launch arm_launch.yaml" }
arm_camera = { cmd = "ros2 launch robp_launch arm_camera_launch.yaml" }
lidar = { cmd = "ros2 launch robp_launch lidar_launch.yaml" }
phidgets = { cmd = "ros2 launch robp_launch phidgets_launch.yaml" }
realsense = { cmd = "ros2 launch robp_launch realsense_launch.yaml" }
odom = { cmd = "ros2 launch robp_boot_camp_launch boot_camp_part1_launch.xml" }
arm_pick = { cmd = "ros2 run arm_pick arm_pick_node" }
arm_drop = { cmd = "ros2 run arm_pick arm_drop_node" }
arm_pick_ik = { cmd = "ros2 run arm_pick arm_pick_ik" }
sample = "python image_sampler.py --ros-args -p output_dir:=$PIXI_PROJECT_ROOT/cube_images"
build = "colcon build --symlink-install"
build_tracik = "colcon build --symlink-install --packages-select trac_ik_lib trac_ik_kinematics_plugin"

[tasks.phidgets_teleop]
cmd = "python3 src/phidgets_teleop/phidgets_teleop/teleop.py"

[tasks.robot_teleop_kinematic]
cmd = "python3 src/robot_teleop_kinematic/robot_teleop_kinematic/robot_teleop_kinematic.py"

[tasks.robot_drive_distance]
cmd = "python3 src/robot_drive_distance/robot_drive_distance/robot_drive_distance.py"

[tasks.jazzy_teleop]
cmd = "python3 src/teleop_twist_joy/teleop_twist_joy/jazzy_teleop.py"


[tasks.detection]
cmd = "python3 src/detection/detection/detection.py"

[tasks.arm_detector]
cmd = "python3 src/arm_detector/arm_detector/arm_detector.py"
 
[tasks.task_generator]
cmd = "python3 src/task_generator/task_generator/task_generator.py"

[tasks.random_goal_generator]
cmd = "python3 src/random_goal_generator/random_goal_generator/random_goal_generator.py"

[tasks.install_udev_rules]
cmd = '''
echo "Copying udev rules" &&
sudo cp 99-robp.rules /etc/udev/rules.d/99-robp.rules &&
echo "Restarting udev" &&
sudo service udev reload &&
sudo service udev restart &&
sudo udevadm control --reload &&
sudo udevadm trigger &&
echo "Finished"
'''

[tasks.uninstall_udev_rules]
cmd = '''
echo "Removing udev rules" &&
sudo rm /etc/udev/rules.d/99-robp.rules &&
echo "Restarting udev" &&
sudo service udev reload &&
sudo service udev restart &&
sudo udevadm control --reload &&
sudo udevadm trigger &&
echo "Finished"
'''

